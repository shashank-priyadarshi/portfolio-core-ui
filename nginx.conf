events {
    # Define the number of worker processes
    worker_connections 1024;
}

http {
server {
    listen 80;
    server_name localhost;
    server_tokens off;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name localhost;
    server_tokens off;

    ssl_certificate /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;

    # Other SSL configurations can be added here
    ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers 'TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 10m;
    # ssl_session_tickets on;
    # ssl_session_ticket_key /etc/nginx/ssl_session_ticket.key;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # resolver 8.8.8.8 8.8.4.4 valid=300s;
    # resolver_timeout 5s;

    root   /usr/share/nginx/html;

    # location ~ /browser/index.html|.*\.json$ {
    #     expires -1;
    #     add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
    # }

    # location ~ .*\.css$|.*\.js$ {
    #     add_header Cache-Control 'max-age=31449600'; # one year
    #     # include /etc/nginx/security-headers.conf;
    # }

    location / {
        expires -1;
        add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
        try_files $uri$args $uri$args/ /browser/index.html;
        add_header Cache-Control 'max-age=86400'; # one day
        # include /etc/nginx/security-headers.conf; 
    }
}
}